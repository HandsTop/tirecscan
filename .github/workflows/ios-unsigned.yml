name: Build free iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Lager Scan System
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle web application and create iOS project
        run: |
          npm run mobile:build
          npx cap add ios --packagemanager SPM
          cp logo.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Barcode scanning requires camera access.'" ios/App/App/Info.plist

      - name: Build unsigned iPhone application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA for AltStore
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/App.app
          zip -qry Lager-Scan-System-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lager-Scan-System-unsigned
          path: Lager-Scan-System-unsigned.ipa
          if-no-files-found: error
