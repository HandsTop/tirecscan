workflows:
  ios-testflight:
    name: Lager Scan System - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: latest
      node: 24
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lagerscansystem.app
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Bundle the web application and update iOS
        script: npm run mobile:sync
      - name: Apply Apple signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
